name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-34" "build-tools;34.0.0"
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed' }
      - name: Build and test Debug
        shell: pwsh
        run: ./build.ps1 -BuildType Debug
      - name: Build and test unsigned Release
        shell: pwsh
        run: ./build.ps1 -BuildType Release -Unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: pageh-apks
          path: dist/*.apk
          if-no-files-found: error
